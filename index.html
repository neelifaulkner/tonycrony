<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tony Crony</title>

<meta
    name="description"
    content="An investigative reporting project by Neeli Faulkner."
>

<meta name="author" content="Neeli Faulkner">

<style>
:root {
    --accent: #ff7a00;
    --text: #f5efe6;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    height: 100%;
}

body {
    background: #000000;

    font-family: Georgia, serif;
    color: var(--text);

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 100vh;
}

.container {
    width: min(1600px, 95vw);
    text-align: center;
}

.map-image {
    width: 100%;
    height: auto;

    display: block;

    box-shadow:
        0 0 120px rgba(0, 20, 40, 0.6),
        0 30px 80px rgba(0,0,0,.5);
}

.coming-soon {
    margin-top: 35px;
}

.coming-soon h1 {
    font-size: clamp(1.75rem, 2.8vw, 3.5rem);

    font-weight: 400;

    letter-spacing: 0.15em;

    color: var(--text);

    text-transform: uppercase;

    text-shadow:
        0 0 20px rgba(0,0,0,.5);
}

.accent-line {
    width: 220px;
    height: 2px;

    background: var(--accent);

    margin: 32px auto 0;

    box-shadow:
        0 0 20px rgba(255,122,0,.8);
}

@media (max-width: 768px) {

    .container {
        width: 95%;
    }

    .coming-soon {
        margin-top: 25px;
    }

    .coming-soon h1 {
        letter-spacing: 0.08em;
    }

    .accent-line {
        width: 140px;
    }
}
</style>

</head>
<body>

<div class="container">

    <img
        src="orangebeachmap2.png"
        alt="Orange Beach Map"
        class="map-image"
    >

    <div class="coming-soon">
        <h1>FULL PROJECT COMING SOON</h1>
        <div class="accent-line"></div>
    </div>

</div>

</body>
</html>
